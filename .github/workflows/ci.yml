name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`'s stricter lockfile-sync check has repeatedly false-flagged
      # Linux-only optional-dependency metadata in lockfiles generated on
      # Windows (a known cross-platform npm quirk, not a real drift) — `npm
      # install` still resolves from the committed lockfile without that
      # check.
      - run: npm install

      - name: Typecheck
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          # Dummy values so the SSR build can resolve import.meta.env types and
          # run prerendering — no live services are contacted at build time.
          PUBLIC_POSTHOG_KEY: phc_ci_placeholder
          PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          PUBLIC_SITE_URL: https://fxreplay.alfonsopayra.me
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          SUPABASE_URL: https://ci.supabase.co
          SUPABASE_ANON_KEY: ci
          SUPABASE_SERVICE_ROLE_KEY: ci
